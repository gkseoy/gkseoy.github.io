title: "Seoyoung Yoon"
tagline: "git blog"
description: "Notes on computer engineering, projects, and research papers."
email: "zxwmqxx@gmail.com"
url: "https://gkseoy.github.io"
baseurl: ""
lang: en
date_format: "%Y-%m-%d"

author:
  name: "Seoyoung Yoon"
  url: "https://github.com/gkseoy"

remote_theme: zivhub/monophase@085334c67f4e23be3b93c79fbbcedb09a492c5aa

collections:
  paper_reviews:
    output: true
    permalink: /paper-reviews/:name/
  event_notes:
    output: true
    permalink: /event-notes/:name/
  seminars:
    output: true
    permalink: /seminars/:name/
  major_studies:
    output: true
    permalink: /major-studies/:name/

defaults:
  - scope:
      path: ""
      type: paper_reviews
    values:
      layout: paper-review
  - scope:
      path: ""
      type: event_notes
    values:
      layout: page
      lang: ko
  - scope:
      path: ""
      type: seminars
    values:
      layout: page
      lang: ko
  - scope:
      path: ""
      type: major_studies
    values:
      layout: major-study
      lang: ko

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
