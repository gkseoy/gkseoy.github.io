<div class="section-tabs" role="group" aria-label="Filter posts" data-post-filters>
  <button type="button" data-feed-filter="all" aria-pressed="true" aria-controls="post-feed">All</button>
  {% for item in site.data.navigation %}
    {% unless item.url == '/' or item.url == '/resume/' %}
      {% assign filter_key = item.url | replace: '/', '' %}
      <button type="button" data-feed-filter="{{ filter_key | escape }}" aria-pressed="false" aria-controls="post-feed">{{ item.title | escape }}</button>
    {% endunless %}
  {% endfor %}
</div>
